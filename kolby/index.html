<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Колбы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Сортировка колб с цветной жидкостью. Без рекламы, работает без интернета.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Колбы">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <div class="level" id="levelLabel">Уровень 1</div>
      <div class="level-sub" id="levelSub"></div>
    </div>
    <div class="moves">
      <b id="moves">0</b>
      <span>ходов</span>
    </div>
  </header>

  <main id="board">
    <div id="flasks" class="flasks"></div>
  </main>

  <footer class="actions">
    <button id="undo" class="btn" type="button" disabled>Отменить</button>
    <button id="restart" class="btn" type="button">Заново</button>
  </footer>

  <div id="win" class="win hidden" aria-hidden="true">
    <div class="win-card">
      <div class="win-emoji">✨</div>
      <div class="win-title" id="winTitle">Уровень пройден</div>
      <div class="win-sub">ходов: <span id="winMoves">0</span></div>
      <button id="next" class="btn primary" type="button">Следующий уровень</button>
      <button id="again" class="btn ghost" type="button">Повторить</button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Колбы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Сортировка колб с цветной жидкостью. Без рекламы, работает без интернета.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Колбы">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div class="glow" aria-hidden="true"></div>

  <header class="top">
    <button class="level-btn" id="levelBtn" type="button" aria-label="Выбрать уровень">
      <span class="level" id="levelLabel">Уровень 1</span>
      <span class="level-sub" id="levelSub"></span>
    </button>
    <div class="top-right">
      <button class="icon-btn" id="soundBtn" type="button" aria-label="Звук включён">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9.5v5h3.2L12 18V6L7.2 9.5H4z"/>
          <path class="waves" d="M15.6 9a4.2 4.2 0 0 1 0 6"/>
          <path class="waves" d="M18.2 6.5a8 8 0 0 1 0 11"/>
          <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
      <div class="moves">
        <b id="moves">0</b>
        <span>ходов</span>
      </div>
    </div>
  </header>

  <main id="board">
    <div id="flasks" class="flasks"></div>
  </main>

  <div class="boosters">
    <button id="addFlask" class="chip" type="button">＋ запасная колба</button>
  </div>

  <footer class="actions">
    <button id="hint" class="btn" type="button">Подсказка</button>
    <button id="undo" class="btn" type="button" disabled>Отменить</button>
    <button id="restart" class="btn" type="button">Заново</button>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="win" class="win hidden" aria-hidden="true">
    <div class="win-card">
      <div class="stars" id="winStars"></div>
      <div class="win-title" id="winTitle">Уровень пройден</div>
      <div class="win-sub" id="winSub">ходов: <span>0</span></div>
      <div class="win-record hidden" id="winRecord">Новый рекорд!</div>
      <button id="next" class="btn primary" type="button">Следующий уровень</button>
      <button id="again" class="btn ghost" type="button">Повторить</button>
    </div>
  </div>

  <div id="lab" class="levels hidden" aria-hidden="true">
    <div class="levels-card">
      <div class="levels-head">
        <div class="levels-title">Лаборатория</div>
        <button id="labClose" class="close" type="button" aria-label="Закрыть">×</button>
      </div>
      <div class="lab-label">Звук переливания — нажми и послушай, запомни номер</div>
      <div class="lab-row" id="labSounds"></div>
      <div class="lab-label">Форма струи — выбери и перелей жидкость на доске</div>
      <div class="lab-row" id="labStreams"></div>
      <div class="lab-label">Форма бутылочек — видно сразу на доске</div>
      <div class="lab-row" id="labShapes"></div>
      <button id="labDone" class="btn primary" type="button">Готово</button>
    </div>
  </div>

  <div id="levels" class="levels hidden" aria-hidden="true">
    <div class="levels-card">
      <div class="levels-head">
        <div class="levels-title">Уровни</div>
        <button id="levelsClose" class="close" type="button" aria-label="Закрыть">×</button>
      </div>
      <button id="dailyCard" class="daily-card" type="button">
        <span class="daily-title">Задание дня</span>
        <span class="daily-sub" id="dailySub">сыграть</span>
      </button>
      <div class="levels-summary" id="levelsSummary"></div>
      <div class="levels-grid" id="levelsGrid"></div>
      <button id="levelsContinue" class="btn primary" type="button">Продолжить</button>
      <button id="soundTest" class="link-btn" type="button">Проверить звук</button>
    <button id="labBtn" class="link-btn" type="button">Лаборатория: звук, струя, бутылочки</button>
      <div class="version" id="appVersion"></div>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="water-sound.js"></script>
<script src="water-pour.js"></script>
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    var hadController = !!navigator.serviceWorker.controller;
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController || reloading) return;
      reloading = true;
      window.location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        if (reg && reg.update) reg.update();
      }).catch(function () {});
    });
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена</title>
<script>
  // Адрес со слешем на конце (например /guides/) GitHub Pages не находит —
  // убираем слеш и открываем нормальную страницу
  var p = location.pathname;
  if (p.length > 1 && p.endsWith("/")) {
    location.replace(p.replace(/\/+$/, "") + location.search + location.hash);
  }
</script>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; color: #222; text-align: center; padding: 64px 16px; }
  a { color: #4a6cf7; }
</style>
</head>
<body>
  <h1>Страница не найдена</h1>
  <p><a href="/">На главную</a> · <a href="/guides">Гайды и приложения</a> · <a href="/friendlypsy/">Найти психолога</a></p>
</body>
</html>
